:[3],multi:!1},{id:"a1-3",week:1,n:3,q:"A threat actor sends a carefully researched email to a senior finance executive, referencing their recent business trip and impersonating their CEO. Which attack type does this describe?",options:["Spear‑phishing","Vishing","General phishing","Smishing"],answer:[0],multi:!1},{id:"a1-4",week:1,n:4,q:"A victim attempts to open their files after a malware infection but finds every document locked behind an unknown cipher. The attacker then demands payment for the decryption key. Which malware category best explains this behavior?",options:["Spyware","Rootkit","Adware","Ransomware"],answer:[3],multi:!1},{id:"a1-5",week:1,n:5,q:"A national government wants to safeguard systems that, if disrupted, could destabilize essential public services. Which of the following system types would be the highest priority under Critical Infrastructure Protection (CIP)?",options:["Consumer mobile apps and entertainment platforms","University learning management systems","SCADA systems managing water treatment and power distribution","Home automation devices"],answer:[2],multi:!1},{id:"a1-6",week:1,n:6,q:"Deploying a firewall alone is sufficient to constitute a complete Information Security program for an organization.",options:["True","False"],answer:[1],multi:!1},{id:"a1-7",week:1,n:7,q:"A security manager wants to ensure that sensitive organizational data cannot be accessed by unauthorized individuals. Which combination of measures best achieves this?",options:["Information classification, secure storage, and enforced access policies","Open access for all staff to improve collaboration efficiency","Faster network speeds and upgraded hardware","Regular system reboots and software updates only"],answer:[0],multi:!1},{id:"a1-8",week:1,n:8,q:"A hospital receptionist verbally shares a patient's diagnosis and full name with a visitor who claims to be a relative but has no verified authorization. Which category of violation does this represent?",options:["A breach of general data privacy with no specific regulatory consequence","An acceptable disclosure under standard hospital protocols","A network security incident requiring IT intervention","A breach involving Protected Health Information (PHI)"],answer:[3],multi:!1},{id:"a1-9",week:1,n:9,q:"During an audit, a database record is found to have been silently modified by an unauthorized party. Which information security property has been violated?",options:["Availability","Integrity","Authenticity","Confidentiality"],answer:[1],multi:!1},{id:"a1-10",week:1,n:10,q:"An organization rolls out a data classification scheme, runs employee awareness sessions, and deploys endpoint security tools. Collectively, these efforts are best described as implementing:",options:["Information Security","Operations Security","Network Security","Physical Security"],answer:[0],multi:!1},{id:"a2-1",week:2,n:1,q:"The attribute that describes whether information is genuine and original rather than reproduced or fabricated is called Authenticity, not Accuracy.",options:["True","False"],answer:[0],multi:!1},{id:"a2-2",week:2,n:2,q:"A new IT manager wants to tighten access controls without disrupting productivity. Which practices should they implement? (Select all that apply.)",options:["Providing all staff with administrator‑level access to avoid bottlenecks","Maintaining and auditing access logs to detect anomalies","Periodically reviewing and revoking unnecessary user access rights","Assigning permissions based on each employee's role and responsibilities"],answer:[1,2,3],multi:!0},{id:"a2-3",week:2,n:3,q:"A CISO needs a structured model to assess whether their organization's security program adequately covers the goals, data states, and control types relevant to protecting information. Which model was designed for this purpose?",options:["OSI Model","CIA Triad","STRIDE Model","McCumber Cube"],answer:[3],multi:!1},{id:"a2-4",week:2,n:4,q:"A developer ships a web application with an unvalidated input field that allows attackers to inject SQL commands. Before any attack occurs, this unvalidated field is best described as:",options:["A vulnerability","A threat","An exploit","An attack vector in active use"],answer:[0],multi:!1},{id:"a2-5",week:2,n:5,q:"When malware slips through a detection system unidentified and causes damage, this is an example of a False Negative.",options:["True","False"],answer:[0],multi:!1},{id:"a2-6",week:2,n:6,q:"A security analyst maps their controls across three axes: security goals, data states, and control types. Which framework are they applying, and which dimension addresses how data exists at any given moment?",options:["CIA Triad; the first dimension","NIST CSF; the third dimension","McCumber Cube; the second dimension","COBIT; the second dimension"],answer:[2],multi:!1},{id:"a2-7",week:2,n:7,q:"A security tool quarantines a trusted internal application used daily by the finance team, flagging it as malware. Operations halt. How is this detection outcome classified?",options:["True Positive — the threat was correctly identified","False Positive — a safe file was incorrectly flagged as malicious","True Negative — a safe file was correctly cleared","False Negative — a real threat was missed by the system"],answer:[1],multi:!1},{id:"a2-8",week:2,n:8,q:"A server sends data packets to a workstation across an office. Which component of the information system made this transfer possible?",options:["The server's hardware processor","The network infrastructure","The operating system software","The stored data files"],answer:[1],multi:!1},{id:"a2-9",week:2,n:9,q:"An employee receives an email from ‘support@micros0ft.com’ asking them to click a link and reset their password. What is the most appropriate immediate response?",options:["Open the attachment to verify the content before deciding","Forward it to colleagues to check if they received the same email","Click the link since the sender mentions Microsoft","Verify the sender's legitimacy independently and avoid clicking any links"],answer:[3],multi:!1},{id:"a2-10",week:2,n:10,q:"An attacker crafts a SQL injection string that takes advantage of an unvalidated input field to dump an entire customer database. The crafted string itself is best described as:",options:["A vulnerability","An exploit","A threat agent","A security patch"],answer:[1],multi:!1},{id:"a3-1",week:3,n:1,q:"Which of the following are the goals of information security governance?",options:["Only i and ii are correct","Only i, ii, and iv are correct","Only i, ii, and iii are correct","i, ii, iii, and iv are correct"],answer:[3],multi:!1},{id:"a3-2",week:3,n:2,q:"Which of the following statements is not correct?",options:["COBIT is a framework to organize business processes. COBIT defines the design factors the enterprise should consider when building a best‑fit governance system.","COBIT is not a comprehensive description of an enterprise's IT environment.","COBIT defines the components to build and sustain a governance system: processes, organizational structures, policies and procedures, information flows, culture and behaviors, skills, and infrastructure."],answer:[0],multi:!1},{id:"a3-3",week:3,n:3,q:"Match the following",options:["i – a, ii – c, iii – b, iv – d","i – c, ii – a, iii – b, iv – d","i – c, ii – a, iii – d, iv – b","i – b, ii – c, iii – d, iv – a"],answer:[2],multi:!1},{id:"a3-4",week:3,n:4,q:"COSO's ERM framework emphasizes:",options:["Operational efficiency","Risk identification and assessment","Regulatory compliance","Human resource management"],answer:[1],multi:!1},{id:"a3-5",week:3,n:5,q:"Which of the following is NOT a fundamental component of the NIST Cybersecurity Framework?",options:["The Framework profile","The Framework tiers","The Framework core","The Framework control"],answer:[3],multi:!1},{id:"a3-6",week:3,n:6,q:"An organization adopts a Governance, Risk, and Compliance (GRC) framework. What benefits can it expect to achieve?",options:["Improved accountability and responsible operations","Better decisions based on data and insights","Stronger cybersecurity management","All of the above"],answer:[3],multi:!1},{id:"a3-7",week:3,n:7,q:"Which of the following is not true?",options:["ISO/IEC 27001 is suitable only for large organizations in the information technology sector and is not relevant to small or medium‑sized businesses.","Conformity with ISO/IEC 27001 indicates that an organization has established a systematic approach to managing risks associated with the security of the information it owns or processes, and that this approach adheres to the best practices and principles specified in the International Standard.","ISO/IEC 27001 enables organizations to develop a risk‑aware culture by proactively identifying, assessing, and addressing information security vulnerabilities and weaknesses.","ISO/IEC 27001 promotes a comprehensive approach to information security by addressing people, processes, policies, and technology to safeguard organizational information assets."],answer:[0],multi:!1},{id:"a3-8",week:3,n:8,q:"Which of the following is not a component of COSO?",options:["Control Activities","Monitoring","Risk Response","Risk Assessment"],answer:[2],multi:!1},{id:"a3-9",week:3,n:9,q:"Information security governance is the application of the principles of corporate governance to the information security function.",options:["True","False"],answer:[0],multi:!1},{id:"a3-10",week:3,n:10,q:"ISO standards, such as ________ for risk management or ________ for information security, provide global best practices for compliance and risk management.",options:["ISO 31000, ISO 27001","ISO 27001, ISO 31000","ISO 27001, ISO 17799","ISO 17799, ISO 27001"],answer:[0],multi:!1},{id:"a4-1",week:4,n:1,q:"A ________ is prepared by the organization to anticipate, react to, and recover from events that threaten the security of information and information assets in the organization.",options:["Disaster Recovery Plan","Incident Response Plan","Contingency Plan","Business Continuity Plan"],answer:[2],multi:!1},{id:"a4-2",week:4,n:2,q:"Business Resumption Planning (BRP) consists of the actions taken by senior management to develop and implement a combined _______ and ______, and set of recovery teams.",options:["Disaster Recovery Plan, Business Continuity Plan","Incident Response Plan, Business Continuity Plan","Contingency Plan, Disaster Recovery Plan","Disaster Recovery Plan, Incident Response Plan"],answer:[0],multi:!1},{id:"a4-3",week:4,n:3,q:"Which of the following statements is not true?",options:["Tactical planning focuses on short‑term undertakings that will be completed within one or two years.","An operational plan outlines the required tasks for all relevant departments, along with communication and reporting requirements.","Strategic planning sets the long‑term direction to be taken by the organization and each of its component parts.","Operational plans are used to create tactical plans, which in turn are used to develop strategic plans."],answer:[3],multi:!1},{id:"a4-4",week:4,n:4,q:"True or False: Incident response planning comprises four phases: incident planning, incident detection, incident reaction, and incident recovery.",options:["True","False"],answer:[1],multi:!1},{id:"a4-5",week:4,n:5,q:"Which of the following statements are true?",options:["Only II and IV are true","Only I, II and III are true","Only II, III and IV are true","I, II, III and IV are true"],answer:[3],multi:!1},{id:"a4-6",week:4,n:6,q:"The total amount of time the system owner or authorizing official is willing to accept for a business process outage or disruption is known as:",options:["Work Recovery Time","Maximum Tolerable Downtime","Maximum Recovery Time","Recovery Point Objective"],answer:[1],multi:!1},{id:"a4-7",week:4,n:7,q:"Which of the following statements is not true?",options:["The incident response plan focuses on immediate response, but escalates to DR/BC if the attack is disastrous.","The disaster recovery plan focuses on restoring systems at the original site after disasters occur.","The business continuity plan occurs only when DR plan fails and requires more than simple restoration.","The BC plan establishes critical business functions at an alternate site."],answer:[2],multi:!1},{id:"a4-8",week:4,n:8,q:"Which of the following events are Definite indicators of incidents?",options:["Use of dormant accounts, Changes to logs, Presence of hacker tools, Notifications by partner or peer","Activities at unexpected times, Notifications by partner or peers, Unusual system crashes, Presence of unknown programs","Notification from IDPS, Presence of new accounts, Unusual system crashes, Use of dormant accounts","Unusual consumption of computing resources, Changes to logs, Unusual system crashes, Presence of unfamiliar files"],answer:[0],multi:!1},{id:"a4-9",week:4,n:9,q:"True or False: Incident classification is the process of examining an incident candidate and determining whether it constitutes an actual incident.",options:["True","False"],answer:[0],multi:!1},{id:"a4-10",week:4,n:10,q:"A fully configured computing facility that includes all services, communications links, and physical plant operations, used for BC operations, is known as:",options:["Warm site","Cold site","Hot site","Service Bureau"],answer:[2],multi:!1},{id:"a5-1",week:5,n:1,q:"Identify the correct statement.",options:["Guidelines are examples of actions that illustrate compliance with policies.","Procedures are non‑mandatory recommendations that employees may use as a reference when complying with a policy.","Standards are step‑by‑step instructions that guide employees in following policies and guidelines.","Practices are examples of actions that illustrate compliance with policies."],answer:[3],multi:!1},{id:"a5-2",week:5,n:2,q:"Which of the following is not a component of Enterprise Information Security Policies (EISP)?",options:["Statement of Purpose","Need for Information Security","Authorized access and usage of equipment","Information Security Responsibilities and Roles"],answer:[2],multi:!1},{id:"a5-3",week:5,n:3,q:"A policy to be effective and legally enforceable should meet which criteria? (Select all that apply)",options:["The organization must be able to demonstrate that the policy has been made readily available for review by the employee.","The organization must be able to demonstrate that it disseminated the document in an intelligible form.","The organization must be able to demonstrate that the employee understands the requirements and content of the policy.","The organization must be able to demonstrate that the employee agrees to comply with the policy through act or affirmation."],answer:[0,1,2,3],multi:!0},{id:"a5-4",week:5,n:4,q:"Which approaches are used to create and manage ISSPs within an organization? (Select all that apply)",options:["Independent ISSP documents, each tailored to a specific issue.","A single comprehensive ISSP document that covers all issues.","A modular ISSP document that unifies policy creation and administration while maintaining each specific issue’s requirements.","A hierarchical ISSP structure in which all issue‑specific requirements are incorporated directly into the EISP."],answer:[0,1,2],multi:!0},{id:"a5-5",week:5,n:5,q:"Which of the following statements is not true?",options:["SysSPs function as standards or procedures to be used when configuring or maintaining systems.","SysSPs can be separated into managerial guidance SysSPs and technical specifications SysSPs.","Systems‑specific policies can be developed at the same time as ISSPs or prepared in advance.","Technical specifications SysSP expresses management’s intent for the acquisition, implementation, configuration, and management of a particular technology, written from a business perspective."],answer:[3],multi:!1},{id:"a5-6",week:5,n:6,q:"________________ consists of details about user access permissions and privileges for an organizational asset or resource.",options:["Access Control List","Capabilities Table","Configuration rules","User Policies"],answer:[0],multi:!1},{id:"a5-7",week:5,n:7,q:"True or False: Capability Tables combine the information in Access Control Lists and Access Control Matrix.",options:["True","False"],answer:[1],multi:!1},{id:"a5-8",week:5,n:8,q:"_________ govern how a security system reacts to the data it receives.",options:["User Policies","Configuration Rules","Access Control Lists","File Integrity Baselines"],answer:[1],multi:!1},{id:"a5-9",week:5,n:9,q:"Which of the following most accurately distinguishes cyber hygiene from cybersecurity?",options:["Cyber hygiene is hardware‑focused; cybersecurity is software‑focused.","Cyber hygiene is reactive; cybersecurity is proactive.","Cyber hygiene involves routine practices for maintaining digital health; cybersecurity encompasses broader strategies, technologies, and incident response.","Cyber hygiene focuses only on personal devices; cybersecurity is limited to organizations."],answer:[2],multi:!1},{id:"a5-10",week:5,n:10,q:"_______ is an organizational policy that offers detailed, targeted guidance regarding the use of a resource.",options:["Systems‑specific security policy","General or security program policy","Enterprise information security policy","Issue‑specific security policy"],answer:[3],multi:!1},{id:"a6-1",week:6,n:1,q:"Match the following:",options:["1 – a, 2 – d, 3 – c, 4 – b","1 – d, 2 – a, 3 – b, 4 – c","1 – d, 2 – b, 3 – a, 4 – c","1 – b, 2 – a, 3 – d, 4 – c"],answer:[2],multi:!1},{id:"a6-2",week:6,n:2,q:"The risk that remains after the risk management process has concluded is a combined function of:",options:["(1) a threat less the effect of threat‑reducing safeguards, (2) a vulnerability less the effect of vulnerability‑reducing safeguards, and (3) an asset less the effect of asset value‑reducing safeguards.","(1) a threat less the effect of threat‑reducing safeguards, (2) a vulnerability plus the effect of vulnerability‑reducing safeguards…","(1) a threat plus the effect of threat‑reducing safeguards…","(1) a threat plus the effect of threat‑reducing safeguards…"],answer:[0],multi:!1},{id:"a6-3",week:6,n:3,q:"Which of the following is not a component of Risk Assessment?",options:["Determine Loss Frequency","Specify Asset Vulnerabilities","Calculate Risk","Assess Risk Acceptability"],answer:[1],multi:!1},{id:"a6-4",week:6,n:4,q:"_________ is the quantity and nature of risk that organizations are willing to accept as they evaluate the trade‑offs between perfect security and unlimited accessibility.",options:["Residual risk","Risk appetite","Loss magnitude","Loss frequency"],answer:[1],multi:!1},{id:"a6-5",week:6,n:5,q:"Which of the following are components of risk identification? (Select all that apply)",options:["Identify, Inventory, & Categorize Assets","Evaluate Loss Magnitude","Classify, Value, & Prioritize Assets","Specify Asset Vulnerabilities"],answer:[0,2,3],multi:!0},{id:"a6-6",week:6,n:6,q:"The classification scheme used by the U.S. Classified National Security Information (NSI) system “to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security…”",options:["Top Secret","Secret","Confidential","Internal"],answer:[1],multi:!1},{id:"a6-7",week:6,n:7,q:"Match the following threats with examples:",options:["1 – c, 2 – a, 3 – b, 4 – d","1 – b, 2 – a, 3 – d, 4 – c","1 – c, 2 – d, 3 – b, 4 – b","1 – b, 2 – d, 3 – a, 4 – d"],answer:[1],multi:!1},{id:"a6-8",week:6,n:8,q:"An attacker bypasses or compromises a router, gains access to an organization's network, and encrypts critical data, demanding payment in exchange for the decryption key. This scenario is best classified as:",options:["Information extortion","Sabotage or vandalism","Espionage or trespass","Software attacks"],answer:[0],multi:!1},{id:"a6-9",week:6,n:9,q:"Using the formula Risk = (Loss Frequency × Loss Magnitude) + Uncertainty Term, what is the risk score for Asset A?",options:["2.25","2.5","2.75","5"],answer:[2],multi:!1},{id:"a6-10",week:6,n:10,q:"True or False: The goal of risk assessment is to assign a risk rating or score that represents the relative risk for a specific vulnerability of an information asset.",options:["True","False"],answer:[0],multi:!1},{id:"a7-1",week:7,n:1,q:"Which of the following statements correctly describes the processor protection ring model?",options:["User programs execute in Ring 0 because they require maximum privileges.","Ring 3 is the most privileged ring used by the operating system.","The kernel executes in the highest privilege level, and no software is more privileged than the kernel.","All four protection rings are equally privileged."],answer:[2],multi:!1},{id:"a7-2",week:7,n:2,q:"Which of the following is not true with respect to Public‑Key Encryption?",options:["One algorithm is used for encryption and decryption with a pair of keys, one for encryption and one for decryption.","The sender and receiver must each have one of the matched pair of keys.","One of the two keys must be kept secret.","The sender and receiver must share the algorithm and the key."],answer:[3],multi:!1},{id:"a7-3",week:7,n:3,q:"Which of the following statements are true? (Select all that apply)",options:["A hash function maps a variable‑length message into a fixed‑length hash value, or message digest.","Hash functions can be used for intrusion detection and virus detection.","The compression function used in secure hash algorithms falls into one of two categories: a function based on a public‑key cryptographic algorithm or an algorithm based on a stream cipher.","A cryptographic hash function can be used to construct a pseudorandom function (PRF) or a pseudorandom number generator (PRNG)."],answer:[0,1,3],multi:!0},{id:"a7-4",week:7,n:4,q:"HTTPS refers to the combination of ______ and ______ to implement secure communication between a Web browser and a Web server.",options:["HTTP, SSL","HTTP, SSH","UDP, TCP","TCP, SSL"],answer:[0],multi:!1},{id:"a7-5",week:7,n:5,q:"__________ is the principle that an individual is entrusted to safeguard and control equipment, keying material, and information and is answerable to the proper authority for their loss or misuse, whereas __________ is the principle that ensures actions and events can be traced and reviewed through appropriate records and evidence.",options:["Auditability, Accountability","Accountability, Auditability","Confidentiality, Auditability","Responsibility, Accountability"],answer:[1],multi:!1},{id:"a7-6",week:7,n:6,q:"Match the following",options:["1 – c, 2 – a, 3 – b, 4 – d","1 – b, 2 – c, 3 – b, 4 – d","1 – c, 2 – b, 3 – a, 4 – d","1 – b, 2 – c, 3 – b, 4 – a"],answer:[0],multi:!1},{id:"a7-7",week:7,n:7,q:"______ masks your Internet protocol (IP) address, creating a private connection from a public Wi‑Fi connection.",options:["IPSEC","SSL","VPN","DNS"],answer:[2],multi:!1},{id:"a7-8",week:7,n:8,q:"Match the following",options:["1 – c, 2 – a, 3 – b, 4 – d","1 – d, 2 – c, 3 – a, 4 – b","1 – d, 2 – a, 3 – c, 4 – b","1 – b, 2 – c, 3 – b, 4 – a"],answer:[1],multi:!1},{id:"a7-9",week:7,n:9,q:"The following figure depicts which attack?",options:["DDOS","Brute Force Attack","Session Hijacking","DNS Spoofing"],answer:[0],multi:!1},{id:"a7-10",week:7,n:10,q:"Which of the following is the primary function of a SIEM system?",options:["Encrypting all network traffic","Collecting, correlating, and analyzing security logs and events","Blocking all unauthorized websites","Performing software vulnerability scanning"],answer:[1],multi:!1},{id:"a8-1",week:8,n:1,q:"Which of the following statements is not true?",options:["Risk management involves three major undertakings: risk identification, risk assessment, and risk control.","Risk assessment is the process of identifying risk, assessing its relative magnitude, and taking steps to reduce it to an acceptable level.","Risk identification is the recognition, enumeration, and documentation of risks to an organization’s information assets. Risk identification also involves classifying, valuing, and prioritizing assets."],answer:[1],multi:!1},{id:"a8-2",week:8,n:2,q:"________ is the quantity and nature of risk that an organization is willing to accept while balancing security requirements against business needs such as accessibility and usability.",options:["Risk appetite","Risk exposure","Residual risk","Risk capacity"],answer:[0],multi:!1},{id:"a8-3",week:8,n:3,q:"True or False: Residual risk is a combined function of (1) a threat less the effect of threat‑reducing safeguards, (2) a vulnerability less the effect of vulnerability‑reducing safeguards, and (3) an asset less the effect of asset value‑reducing safeguards.",options:["True","False"],answer:[0],multi:!1},{id:"a8-4",week:8,n:4,q:"An organization estimates that a data breach would result in a Single Loss Expectancy (SLE) of ₹8,00,000. The Annualized Loss Expectancy (ALE) is estimated to be ₹12,00,000. What is the Annualized Rate of Occurrence (ARO)?",options:["0.5","1.0","1.5","2.0"],answer:[2],multi:!1},{id:"a8-5",week:8,n:5,q:"An organization's critical server has an Asset Value (AV) of ₹15,00,000 and an Exposure Factor (EF) of 40%. The threat is expected to occur 2 times per year. What is the Annualized Loss Expectancy (ALE)?",options:["₹6,00,000","₹12,00,000","₹20,00,000","₹30,00,000"],answer:[1],multi:!1},{id:"a8-6",week:8,n:6,q:"A company has an Annualized Loss Expectancy (ALE) of ₹20,00,000 before implementing a security safeguard. After implementing the safeguard, the Annualized Loss Expectancy (ALE) is ₹8,00,000. The Annual Cost of Safeguard (ACS) is ₹3,00,000. What is the Cost‑Benefit Estimate (CBE)?",options:["₹5,00,000","₹8,00,000","₹9,00,000","₹12,00,000"],answer:[2],multi:!1},{id:"a8-7",week:8,n:7,q:"Identify the biometric error measures represented by the numbered curves/point in the figure.",options:["1 – FAR, 2 – FRR, 3 – CER","1 – FRR, 2 – FAR, 3 – CER","1 – FAR, 2 – CER, 3 – FRR","1 – CER, 2 – FAR, 3 – FRR"],answer:[0],multi:!1},{id:"a8-8",week:8,n:8,q:"Which of the following correctly distinguishes between identification and authentication?",options:["Identification verifies the user's identity using a password, while authentication is the process of claiming an identity using a username.","Identification is the process of claiming an identity, while authentication verifies that the claimed identity is genuine.","Identification determines what resources a user can access, while authentication records the user's activities.","Identification and authentication are two terms used for the same process of verifying a user's identity."],answer:[1],multi:!1},{id:"a8-9",week:8,n:9,q:"An organization wants to ensure that an employee cannot later deny having approved an electronic purchase order. Which mechanism would be most appropriate?",options:["Encrypting the purchase order using the organization's public key","Generating a cryptographic hash of the purchase order","Applying a digital signature using the employee's private key","Storing the purchase order in an access‑controlled database"],answer:[2],multi:!1},{id:"a8-10",week:8,n:10,q:"A user wants to verify that a website's public key actually belongs to the organization operating the website. Which entity is primarily responsible for providing this assurance?",options:["Registration Authority (RA)","Certificate Repository","Identity Provider (IdP)","Certificate Authority (CA)"],answer:[3],multi:!1},{id:"a9-1",week:9,n:1,q:"Who first introduced the Fair Information Practice Principles (FIPPs)?",options:["The Federal Trade Commission (FTC)","A private industry consortium","The European Union","The US Secretary's Advisory Committee on Automated Personal Data Systems"],answer:[3],multi:!1},{id:"a9-2",week:9,n:2,q:"Who is credited with popularizing “the right to be let alone” in American privacy law, and in which year?",options:["Alan Westin, 1967","Warren & Brandeis, 1890","Richard Posner, 1975","Aristotle, 4th century BCE"],answer:[1],multi:!1},{id:"a9-3",week:9,n:3,q:"Which school of thought holds that privacy has no independent existence and must always be derived from other rights like property or bodily security?",options:["Coherentism","Reductionism","Feminist view","Economic view"],answer:[1],multi:!1},{id:"a9-4",week:9,n:4,q:"Which stakeholder in a data ecosystem “determines the purposes and means of processing personal data,” termed Data Fiduciary under India’s PDP?",options:["Data Subject","Controller","Processor","Regulator"],answer:[1],multi:!1},{id:"a9-5",week:9,n:5,q:"What is the equivalent term for “Data Subject” under India’s Personal Data Protection framework?",options:["Data Fiduciary","Data Processor","Data Principal","Data Controller"],answer:[2],multi:!1},{id:"a9-6",week:9,n:6,q:"(MSQ) Which of the following are among the four dimensions of concern for information privacy?",options:["Concern on Collection","Concern on Unauthorized Access","Concern on Encryption Strength","Concern on Secondary Use"],answer:[0,1,3],multi:!0},{id:"a9-7",week:9,n:7,q:"According to Posner’s (1975) economic view, when does privacy matter?",options:["Always, regardless of cost","Only insofar as it has economic consequences","Never, it is purely a social construct","Only in employer–employee relationships"],answer:[1],multi:!1},{id:"a9-8",week:9,n:8,q:"Which era in Westin’s (2003) evolution of information privacy is marked by the rise of the Internet, the emergence of Web 2.0, and a major geopolitical event?",options:["Privacy Baseline (1945–1960)","1st Era of Privacy (1961–1979)","2nd Era of Privacy (1980–1989)","3rd Era of Privacy (1990–2002)"],answer:[3],multi:!1},{id:"a9-9",week:9,n:9,q:"Alan Westin’s 1967 work *Privacy and Freedom* distinguished “privacy” from informational self‑determination. Which pairing is correct?",options:["Privacy is control over exposure to others; informational self‑determination is control over disclosure of personal data","Privacy is a legal right; information privacy is a moral principle","Privacy applies to individuals; information privacy applies only to institutions","Privacy is derived from property rights; information privacy is derived from bodily security"],answer:[0],multi:!1},{id:"a9-10",week:9,n:10,q:"(True/False) Coherentism treats privacy as a right derived from other fundamental rights like property and bodily security.",options:["True","False"],answer:[1],multi:!1},{id:"a10-1",week:10,n:1,q:"Confidentiality concerns the externalization of restricted but accurate information to a specific, authorized entity.",options:["True","False"],answer:[0],multi:!1},{id:"a10-2",week:10,n:2,q:"Which earlier regulatory framework evolved into the GDPR by 2018?",options:["APEC privacy framework","OECD Guidelines","FTC privacy principles","EU Data Protection Directive"],answer:[3],multi:!1},{id:"a10-3",week:10,n:3,q:"In the randomization technique for privacy‑preserving data mining, what does the data receiver do with the randomized values transmitted by data providers?",options:["Discards the noise and reconstructs exact original values","Employs a distribution reconstruction algorithm to estimate the original data distribution","Applies k‑anonymity to the randomized values","Encrypts the noise component before use"],answer:[1],multi:!1},{id:"a10-4",week:10,n:4,q:"What does the k‑anonymity requirement state about a released dataset?",options:["Every record must be fully anonymous with no identifiers at all","Every combination of quasi‑identifier values must be indistinctly matched to at least k individuals","At most k attributes can be disclosed per record","Data must be encrypted using a k‑bit key"],answer:[1],multi:!1},{id:"a10-5",week:10,n:5,q:"Data that has been de‑identified and encrypted, but for which re‑identification remains possible using a separate key, is classified under GDPR as:",options:["Anonymous data, fully outside GDPR scope","Personal data, still within GDPR scope","Non‑personal data once encrypted","Quasi‑identifier data"],answer:[1],multi:!1},{id:"a10-6",week:10,n:6,q:"Completely removing certain columns and reducing the granularity of others, as part of k‑anonymization, describes which two techniques?",options:["Suppression and encryption","Generalization and encryption","Suppression and generalization","Randomization and suppression"],answer:[2],multi:!1},{id:"a10-7",week:10,n:7,q:"Which of the following are quasi‑identifiers rather than direct identifiers? (Select all that apply)",options:["ZIP code","Passport / ID card number","Date of birth","Gender"],answer:[0],multi:!1},{id:"a10-8",week:10,n:8,q:"Individuals reporting that they value privacy highly, while freely sharing personal data on social media, illustrates which phenomenon?",options:["Prioritizing convenience over privacy alone","Unawareness of behavioral impact on privacy","Privacy Paradox","The balance between privacy protection and data sharing"],answer:[2],multi:!1},{id:"a10-9",week:10,n:9,q:"Which statement correctly distinguishes anonymity, secrecy, and transparency?",options:["Anonymity is intentional concealment of information; secrecy conceals identity; transparency discloses information about oneself","Anonymity conceals identity; secrecy is intentional concealment of information; transparency discloses information about oneself","Anonymity conceals identity; secrecy discloses information about oneself; transparency is intentional concealment","Anonymity discloses information about oneself; secrecy conceals identity; transparency is intentional concealment"],answer:[1],multi:!1},{id:"a10-10",week:10,n:10,q:"On an R‑U map plotting disclosure risk against data utility, what does the optimal release point represent?",options:["None of the above","Utilizing all PII data to extract full value without privacy concerns","Complete elimination of all data privacy risks by fully anonymizing all data","Maximizing data usefulness while maintaining acceptable privacy risk"],answer:[3],multi:!1},{id:"a11-1",week:11,n:1,q:"Which of the following is not true about personal data as per GDPR?",options:["Personal data is any information that relates to an individual who can be directly or indirectly identified.","Names and email addresses are personal data.","Location information, ethnicity, gender, biometric data, religious beliefs, web cookies, and political opinions can also be personal data.","Pseudonymous data is not personal data, even if the individual can be easily re‑identified from it"],answer:[3],multi:!1},{id:"a11-2",week:11,n:2,q:"An organization continues to retain personal data even though it is no longer required for the purpose for which it was collected. Which principle is most directly concerned with this situation?",options:["Accuracy","Purpose Limitation","Storage Limitation","Accountability"],answer:[2],multi:!1},{id:"a11-3",week:11,n:3,q:"Which of the following statements best describes the applicability of the GDPR?",options:["GDPR applies only when an organization is physically located in the European Union.","GDPR applies only to organizations that collect names and email addresses.","GDPR can apply to organizations that process personal data, regardless of their location, when the GDPR applies to their processing activities","GDPR applies only to government organizations that process personal data."],answer:[2],multi:!1},{id:"a11-4",week:11,n:4,q:"A person is in a life‑threatening situation, and processing their personal data is necessary to save their life. Which legal basis for processing is most appropriate under GDPR?",options:["Consent","Public interest","Contract","Vital interests"],answer:[3],multi:!1},{id:"a11-5",week:11,n:5,q:"In the context of Aadhaar data, who is considered the Data Principal under DPDP Act?",options:["The Unique Identification Authority of India (UIDAI)","The individual to whom the Aadhaar number and related personal data belong","The service provider that uses Aadhaar authentication","The government agency responsible for processing the data"],answer:[1],multi:!1},{id:"a11-6",week:11,n:6,q:"What is the primary objective of the Digital Personal Data Protection (DPDP) Act, 2023?",options:["To give organizations unrestricted authority to process personal data when a legitimate purpose exists.","To balance the right of individuals to protect their personal data with the need to process such data for lawful purposes.","To restrict the processing of digital personal data primarily to government‑authorized purposes.","To prioritize the prevention of personal‑data processing over its legitimate and lawful use."],answer:[1],multi:!1},{id:"a11-7",week:11,n:7,q:"According to the Digital Personal Data Protection Act, 2023 (DPDP Act), a person who alone or together with others determines the purpose and means of processing personal data is known as:",options:["Data Protection Officer","Data Processor","Data Fiduciary","Consent Manager"],answer:[2],multi:!1},{id:"a11-8",week:11,n:8,q:"The Information Technology Act of India was enacted in which year?",options:["2000","2020","2022","1998"],answer:[0],multi:!1},{id:"a11-9",week:11,n:9,q:"Which of the following correctly identifies the core principles of the Aadhaar technology system?",options:["Openness, central storage, security, and data monetization","Data monetization, vendor‑neutrality, security, and data analytics","Openness, data monetization, security, and data analytics","Openness, vendor‑neutrality, security, and data analytics"],answer:[3],multi:!1},{id:"a11-10",week:11,n:10,q:"The Indian Telegraph Act, 1885, empowered the government to intercept certain communications under specified circumstances.",options:["True","False"],answer:[0],multi:!1},{id:"a12-1",week:12,n:1,q:"Under GDPR, which of the following are accurate requirements?",options:["Only (2) is true","Only (1) is true","(1) and (2) are true","(1) and (2) are false"],answer:[2],multi:!1},{id:"a12-2",week:12,n:2,q:"Individuals demand a much higher price to give up their data (WTA) than they are willing to pay to protect it (WTP), a gap attributed to loss aversion. Which concept pairing explains this?",options:["Privacy calculus and rational disclosure","Prospect Theory explains why WTA valuations exceed WTP valuations","Differential privacy and plausible deniability","Privacy as a reductionist, derivative right"],answer:[1],multi:!1},{id:"a12-3",week:12,n:3,q:"Why does understanding users' valuation of personal data protection matter strategically for a business?",options:["It helps develop privacy‑enhancing initiatives that provide a competitive advantage","It allows mandating strict data policies without regard to consumer preference","It enables using personal data for maximum commercial gain","It facilitates markets where individuals monetize their own data"],answer:[0],multi:!1},{id:"a12-4",week:12,n:4,q:"Before disclosing data, individuals weigh perceived risks against expected benefits. Which theory describes this process?",options:["Individuals are motivated solely by potential benefits of disclosure","Individuals make irrational disclosure decisions","Privacy calculus: a cost‑benefit analysis governs the decision to disclose","Individuals have no control over disclosure"],answer:[2],multi:!1},{id:"a12-5",week:12,n:5,q:"Which architectural approach minimizes personal data shared with any central authority (e.g., in contact‑tracing system design)?",options:["Mandatory participation to maximize effectiveness","Prioritizing public health benefit over privacy protection","Centralized architecture storing all data with a single authority","Decentralized, privacy‑preserving architecture minimizing data sharing"],answer:[3],multi:!1},{id:"a12-6",week:12,n:6,q:"People become more risk‑averse facing a potential privacy loss than facing an equivalent potential gain. Prospect theory predicts that:",options:["Losses are felt more intensely than equivalent gains","People only maximize financial gains","Gains and losses are valued equally","Individuals are more risk‑seeking for potential gains"],answer:[0],multi:!1},{id:"a12-7",week:12,n:7,q:"The same type of personal data is assigned very different worth by different individuals in different contexts. What does this indicate about privacy valuation?",options:["It is consistent across individuals and contexts","It varies based on context and circumstance","It is influenced by external factors but remains stable over time","It is determined solely by economic/market factors"],answer:[1],multi:!1},{id:"a12-8",week:12,n:8,q:"Which of the following are valid components of responsible privacy protection in ML system design?",options:["Safeguarding data privacy within the model itself, alongside responsible data collection and on‑device processing where feasible","Collecting maximum data upfront to improve model accuracy, then restricting access post‑training","Relying solely on legal disclaimers instead of technical safeguards","Treating privacy as a one‑time compliance checkbox at deployment"],answer:[0],multi:!1},{id:"a12-9",week:12,n:9,q:"WTA valuations tend to be substantially higher than WTP valuations for the same privacy good.",options:["True","False"],answer:[0],multi:!1},{id:"a12-10",week:12,n:10,q:"Under the Digital Personal Data Protection Bill, 2022, the individual whose personal data is processed, and who holds the right to give or withdraw consent, is termed:",options:["Data Protection Officer","Data Processor","Data Fiduciary","Data Principal"],answer:[3],multi:!1}],$s={"a1-1":{e:"The attacker manipulates a <b>person</b> rather than a system: impersonating the helpdesk to get credentials is classic <b>social engineering</b> (specifically pretexting / vishing over the phone). Session hijacking steals an active session token, brute force guesses passwords, and SQL injection attacks a database input – none of these rely on tricking a human."},"a1-2":{e:"The course stresses the <b>triple role of technology</b>: it is a <i>source of threat</i>, an <i>asset to protect</i> and a <i>defence weapon</i>. A pen‑testing toolkit used by an attacker to probe and exploit a network is technology acting as a <b>source of threat</b>. (The same toolkit used by your own red team would be a defence weapon.)"},"a1-3":{e:"<b>Spear‑phishing</b> is phishing aimed at a specific, researched individual – here the attacker references the executive's trip and impersonates the CEO (when the target is a senior executive this is sometimes called <i>whaling</i>). General phishing is untargeted mass email; vishing is voice/phone; smishing is SMS."},"a1-4":{e:"Encrypting the victim's files and demanding payment for the decryption key is the defining behaviour of <b>ransomware</b> (an attack on <i>availability</i>). Spyware secretly monitors, a rootkit hides deep in the OS to keep privileged access, and adware pushes advertisements."},"a1-5":{e:'Critical (Information) Infrastructure is defined as systems "whose incapacity or destruction would cause a debilitating impact on national security, governance, economy and social well‑being" (IT Act, as amended). Critical sectors include <b>power & energy</b>, banking, telecom, transport and government. <b>SCADA systems controlling water treatment and power distribution</b> are therefore top priority; consumer apps, LMSs and home automation are not national-critical.'},"a1-6":{e:`<b>False.</b> "Information security is not a product or a technology, but a <i>process</i>" (Whitman & Mattord). A complete program needs multiple layers – physical, personnel, operations, communications, network and information security – plus policy, education/training and governance. The Target breach is the course's proof: Target had five firewalls and still failed.`},"a1-7":{e:"This is about <b>confidentiality</b>. Apart from cryptography, the lecture lists measures for confidentiality: <b>information classification, secure document storage, application of general security policies</b> and education of custodians/end users. Open access destroys confidentiality; faster hardware or reboots don't restrict who can see data."},"a1-8":{e:"A patient's name together with a diagnosis is <b>Protected Health Information (PHI)</b> – health data linked to an identifiable individual, which carries specific regulatory consequences (e.g. HIPAA in the US). Disclosing it to an unverified visitor is a privacy breach of PHI, not an IT/network incident and not an acceptable disclosure."},"a1-9":{e:'<b>Integrity</b> is "the quality or state of being whole, complete, and uncorrupted". Unauthorised modification of a record violates integrity. Confidentiality = only authorised people can <i>see</i> data; availability = data is accessible when needed; authenticity = data is genuine/original.'},"a1-10":{e:"Classification of data, awareness training and endpoint tools together protect <b>information</b> assets across people, process and technology – that is <b>Information Security</b>. Operations security protects a particular operation, network security protects network components/connections, physical security protects premises."},"a2-1":{e:"<b>True.</b> <i>Authenticity</i> is the quality of being genuine or original rather than a reproduction or fabrication. <i>Accuracy</i> means free from mistakes/errors and having the value the user expects. (These belong to the extended list of critical characteristics of information: availability, accuracy, authenticity, confidentiality, integrity, utility, possession.)"},"a2-2":{e:"Good access control follows <b>least privilege</b> and <b>accountability</b>: assign permissions by role (RBAC), periodically review and revoke unneeded rights, and keep/audit access logs to detect anomalies. Giving everyone admin access violates least privilege and massively widens the attack surface."},"a2-3":{e:'The <b>McCumber Cube</b> (NSTISSC security model) has three dimensions: security goals (C, I, A), information states (storage, processing, transmission) and safeguards/control types (policy, education, technology) – 3×3×3 = 27 cells. Its purpose is exactly to check that a security program "does not miss anything". The CIA triad is only one dimension; OSI is a networking model; STRIDE is a threat-modelling model.'},"a2-4":{e:"A <b>vulnerability</b> is a weakness or flaw in a system that could be exploited. Before anyone attacks, the unvalidated input is just that – a weakness. A <i>threat</i> is a potential danger (e.g. hackers), an <i>exploit</i> is the technique/code that uses the weakness, and an <i>attack</i> is the act of exploiting it."},"a2-5":{e:'<b>True.</b> A <b>false negative</b> means the system said "safe" (negative) when the item was actually malicious – the threat was missed. The lecture calls false negatives "very dangerous", while false positives hurt day‑to‑day operations.'},"a2-6":{e:`Three axes – goals, data states, control types – is the <b>McCumber Cube</b>. In the order given in the question (goals → data states → control types) the dimension describing how data exists at any moment (<b>storage, processing, transmission</b>) is the <b>second</b>. <i>Note:</i> in the lecture Prof. Mathew introduces the "computing" (states) dimension first, so read the question's own ordering carefully in the exam.`},"a2-7":{e:'A safe, trusted application wrongly flagged as malware = <b>false positive</b> (the alarm was "positive" but wrong). This is exactly what happened at Target: the team turned off automatic malware deletion because false positives kept halting email and Internet traffic.'},"a2-8":{e:"An information system has six components: <b>software, hardware, data, people, procedures and networks</b>. Moving packets from a server to a workstation is the job of the <b>network</b> component (cables, switches, routers, protocols)."},"a2-9":{e:'"micros<b>0</b>ft.com" (a zero instead of the letter o) is a look‑alike domain – a phishing indicator. The correct response is to <b>verify the sender independently</b> (e.g. contact IT through a known channel) and not click links or open attachments. Forwarding spreads the risk; clicking is what the attacker wants.'},"a2-10":{e:"An <b>exploit</b> is the technique or code used to take advantage of a vulnerability. The unvalidated field is the vulnerability; the crafted SQL string that abuses it is the exploit; the attacker is the threat agent."},"a3-1":{stmt:'<ol class="qstmts"><li><b>i.</b> Strategic alignment of information security with business objectives to ensure organizational goals are effectively supported.</li><li><b>ii.</b> Risk management through the implementation of suitable controls and measures to identify, manage, and mitigate risks to information assets.</li><li><b>iii.</b> Resource management by optimizing the utilization of information security expertise, technologies, and infrastructure in an efficient and effective manner.</li><li><b>iv.</b> Performance measurement by evaluating, monitoring, and reporting information security governance metrics to verify that organizational objectives are being achieved.</li></ol>',e:"All four are goals of information security governance (ITGI / Whitman & Mattord): <b>strategic alignment</b> (i), <b>risk management</b> (ii), <b>resource management</b> (iii) and <b>performance measurement</b> (iv). The fifth goal, not listed here, is <b>value delivery</b> (optimising security investments). So <b>i, ii, iii and iv</b> are all correct."},"a3-2":{e:'COBIT 2019 explicitly says what COBIT is <b>not</b>: "COBIT is <b>not</b> a framework to organize business processes" and "COBIT is not a full description of the whole IT environment". It <i>does</i> define design factors for a best‑fit governance system and the components (processes, organisational structures, policies & procedures, information flows, culture & behaviour, skills, infrastructure). So the incorrect statement is <b>"COBIT is a framework to organize business processes."</b>'},"a3-3":{stmt:'<table class="qtable"><thead><tr><th>Term</th><th>Description</th></tr></thead><tbody><tr><td>i. De facto standard</td><td>a. A standard that has been formally evaluated, approved, and ratified by a formal standards organization.</td></tr><tr><td>ii. De jure standard</td><td>b. Examples of actions that illustrate compliance with policies.</td></tr><tr><td>iii. Guidelines</td><td>c. A standard that has been widely adopted or accepted by a public group rather than a formal standards organization.</td></tr><tr><td>iv. Practices</td><td>d. Nonmandatory recommendations the employee may use as a reference in complying with a policy.</td></tr></tbody></table>',e:'<ul><li><b>De facto</b> ("in fact") standard: widely adopted in practice, not ratified by a formal body → <b>c</b>.</li><li><b>De jure</b> ("by law") standard: formally evaluated, approved and ratified by a standards organisation → <b>a</b>.</li><li><b>Guidelines</b>: non-mandatory recommendations used as a reference → <b>d</b>.</li><li><b>Practices</b>: examples of actions that illustrate compliance → <b>b</b>.</li></ul>Answer: <b>i – c, ii – a, iii – d, iv – b</b>. Remember the hierarchy: policy → standards (mandatory) → guidelines and practices (supporting, non-mandatory).'},"a3-4":{e:'COSO‑ERM "expands the COSO framework taking a <b>risk‑based approach</b>". Its components are about risk: internal environment, objective setting, <b>event identification, risk assessment, risk response</b>, control activities, information & communication, monitoring. So its emphasis is <b>risk identification and assessment</b>.'},"a3-5":{e:'The NIST Cybersecurity Framework has three components: the <b>Framework Core</b> (functions such as Identify, Protect, Detect, Respond, Recover – plus Govern in CSF 2.0), the <b>Implementation Tiers</b> and the <b>Profiles</b>. There is no "Framework control" component.'},"a3-6":{e:"GRC integrates governance (accountability, direction), risk management (data‑driven decisions about risk) and compliance (laws, standards). The benefits include accountability, better informed decisions and stronger cybersecurity management – <b>all of the above</b>."},"a3-7":{e:"ISO/IEC 27001 is designed to be applicable to <b>organisations of any size, type and sector</b> – including SMEs. The other three statements describe genuine benefits (systematic risk-based approach, risk‑aware culture, holistic people/process/technology coverage). So the false statement is the one limiting it to large IT companies."},"a3-8":{e:"The five components of (original) <b>COSO</b> are: control environment, <b>risk assessment</b>, <b>control activities</b>, information & communication, <b>monitoring</b>. <b>Risk response</b> appears only in <b>COSO‑ERM</b>, not in COSO."},"a3-9":{e:'<b>True.</b> Information security governance applies the principles of corporate governance (direction, accountability, oversight by the board/top management) to the information security function. Governance is "a higher order term than management" in the lecture.'},"a3-10":{e:"<b>ISO 31000</b> is the risk‑management standard and <b>ISO/IEC 27001</b> is the information‑security management system standard – in that order. ISO 17799 is the older code of practice (from BS 7799) that was renamed ISO 27002 in 2007."},"a4-1":{e:'The lecture defines <b>contingency planning (CP)</b> as how organisations "prepare for, detect, react to, and recover from events that threaten the security of information resources and assets". IRP, DRP and BCP are the <i>components</i> of CP, each covering only part of that scope.'},"a4-2":{e:"Business Resumption Planning (BRP) combines the <b>Disaster Recovery Plan</b> and the <b>Business Continuity Plan</b> into one plan with a set of recovery teams, because DR (restore at the primary site) and BC (operate at an alternate site) are often activated together."},"a4-3":{e:"Planning flows <b>top‑down</b>: strategic plans (5+ years, long‑term direction) are used to create tactical plans (1–3 years), which in turn are used to develop operational plans (day‑to‑day tasks). The statement reverses this order, so it is the false one."},"a4-4":{e:`<b>False.</b> In the course, the incident response plan is organised in <b>three phases – before the incident, during the incident and after the incident</b> (lecture 12). IR is also described as a <i>reactive</i> measure that starts when an incident is detected, so "incident planning" is not one of IR's own phases. (Do not confuse with the broader CP goal: prepare for, detect, react to and recover from events.)`},"a4-5":{stmt:`<ol class="qstmts"><li><b>I.</b> Business Impact Analysis (BIA) is an investigation and assessment of the various adverse events that can affect the organization, conducted as a preliminary phase of the contingency planning process, which includes a determination of how critical a system or set of information is to the organization’s core processes and recovery priorities.</li><li><b>II.</b> After the contingency planning (CP) policy is developed, the next step in the CP process is conducting a business impact analysis.</li><li><b>III.</b> Business Impact Analysis is a preparatory activity common to both contingency planning (CP) and risk management that helps identify the business functions and information systems most critical to an organization's success.</li><li><b>IV.</b> The initial phase of the Business Impact Analysis (BIA) involves evaluating and prioritizing business processes within the organization according to their contribution to the organization's mission.</li></ol>`,e:"All four are true. <ul><li><b>I</b> is the textbook definition of the BIA: the preliminary CP phase that assesses adverse events and how critical each system is.</li><li><b>II</b>: in the NIST SP 800‑34 CP process, step 1 is the CP policy statement and step 2 is the BIA.</li><li><b>III</b>: the BIA is preparatory work shared by CP and risk management; both need to know which functions and systems matter most.</li><li><b>IV</b>: the first BIA stage determines mission/business processes and their recovery criticality, then sets MTD, RTO, WRT and RPO.</li></ul>"},"a4-6":{e:'<b>Maximum Tolerable Downtime (MTD)</b> = "the total amount of time the system owner/authorizing official is willing to accept for a mission/business process outage or disruption". It decomposes as MTD = RTO + WRT. RPO is about how much <i>data</i> (back to which point in time) can be recovered.',steps:["MTD = RTO + WRT","RTO = max time a system resource can stay unavailable","WRT = time to make the business function work again after technology is restored (testing, validation)","RPO = point in time to which data can be recovered from backup"]},"a4-7":{e:'The BCP does <b>not</b> wait for the DR plan to fail. The BCP is "activated and executed <b>concurrently</b> with the DRP when needed" – DRP restores the primary site while BCP re‑establishes critical functions at an alternate site. The other statements are correct.'},"a4-8":{e:"From the incident indicators table (Pipkin): <b>Definite indicators</b> = use of dormant accounts, changes to logs, presence of hacker tools, notifications by partner or peer, notification by hacker. <i>Probable</i> = activities at unexpected times, presence of new accounts, reported attacks, notification from IDS. <i>Possible</i> = unfamiliar files, unknown programs/processes, unusual consumption of computing resources, unusual system crashes."},"a4-9":{e:'<b>True.</b> "Incident classification: process of examining a possible incident (incident candidate) and determining whether or not it constitutes an actual incident."'},"a4-10":{e:"<b>Hot site</b> = fully configured computer facility with all services, communications links and physical plant operations. Warm site = like a hot site but software applications not kept fully ready. Cold site = only rudimentary services. Service bureau = a shared‑use agency providing physical facilities for a fee."},"a5-1":{e:'Definitions from the "Policies, Standards & Practices" slide: <b>Policy</b> – plan/course of action that influences decisions; <b>Standards</b> – more detailed statements of what must be done to comply; <b>Practices, procedures and guidelines</b> – explain how employees comply. Practices are examples of actions that illustrate compliance. The other options swap definitions: guidelines are non‑mandatory recommendations and procedures are step‑by‑step instructions.'},"a5-2":{e:'Components of the EISP: statement of purpose, IT security elements, <b>need for IT security</b>, <b>IT security responsibilities and roles</b>, reference to IT standards and guidelines. "<b>Authorized access and usage of equipment</b>" is a component of the <b>ISSP</b>, not the EISP.'},"a5-3":{e:"For a policy to be effective and legally enforceable it must be: <b>disseminated</b> (made readily available for review), <b>readable</b> (in an intelligible form, e.g. language/literacy accommodated), <b>understood</b> (employee comprehension demonstrated, e.g. a quiz), <b>agreed to</b> (act or affirmation, e.g. signature/click‑through) and <b>uniformly enforced</b>. All four listed criteria are correct."},"a5-4":{e:"Three common approaches to ISSPs: (1) <b>independent ISSP documents</b> each for one issue; (2) <b>a single comprehensive ISSP</b> covering all issues; (3) <b>a modular ISSP</b> – unified creation/administration while keeping each issue's details separate (usually recommended). Folding all issue requirements into the EISP is not one of them – the EISP is deliberately high-level."},"a5-5":{e:"It is the <b>managerial guidance SysSP</b> that expresses management's intent for acquisition, implementation, configuration and management of a technology (written from a business perspective). A <b>technical specifications SysSP</b> is the system administrator's detailed directions for implementing that managerial policy (ACLs, configuration rules)."},"a5-6":{e:"An <b>Access Control List (ACL)</b> contains details of user access permissions and privileges for an asset – who can access, what, when, where and how, with privileges like read, write, create, modify, delete, compare, copy."},"a5-7":{e:"<b>False.</b> A <b>capability table</b> lists, for each <i>subject</i> (user/group), which objects it can access – i.e. a row of the access control matrix. An ACL is a column (per object). The <b>access control matrix</b> is what combines the information; capability tables don't combine ACLs and the matrix."},"a5-8":{e:'<b>Configuration rules</b> are "the specific configuration codes entered into security systems to guide the execution of the system when information is passing through it" – e.g. firewall rules and IDS rules. They govern how the security system reacts to the data it receives.'},"a5-9":{e:"<b>Cyber hygiene</b> = routine, everyday practices that keep systems healthy (patching, strong passwords, backups, updates). <b>Cybersecurity</b> is broader – strategies, governance, technologies, monitoring and incident response. The other options draw false dichotomies."},"a5-10":{e:'The <b>Issue‑Specific Security Policy (ISSP)</b> "provides detailed, targeted guidance to instruct the organization in secure use of technology systems" – e.g. email, Internet use, personal devices. EISP is high-level/strategic; SysSP is for configuring/maintaining specific systems.'},"a6-1":{stmt:`<table class="qtable"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody><tr><td>1. Risk Assessment</td><td>a. The process of identifying risk, assessing its relative magnitude, and taking steps to reduce it to an acceptable level.</td></tr><tr><td>2. Risk Identification</td><td>b. The recognition, enumeration, and documentation of risks to an organization’s information assets.</td></tr><tr><td>3. Risk Management</td><td>c. The implementation of safeguards that reduce the risks to an organization's information assets to an acceptable level.</td></tr><tr><td>4. Risk Control</td><td>d. A determination of the extent to which an organization’s information assets are exposed to risk.</td></tr></tbody></table>`,e:'<ul><li><b>Risk assessment</b>: determining how far assets are exposed to risk (assigning a risk rating) → <b>d</b>.</li><li><b>Risk identification</b>: recognising, enumerating and documenting risks → <b>b</b>.</li><li><b>Risk management</b>: the whole process: identify, assess, and reduce to an acceptable level → <b>a</b>.</li><li><b>Risk control</b>: implementing safeguards that reduce risk → <b>c</b>.</li></ul>Answer: <b>1 – d, 2 – b, 3 – a, 4 – c</b>. Tip: "management" is the umbrella (a covers all three steps), and "control" is about applying safeguards.'},"a6-2":{e:'Residual risk is "a combined function of (1) a threat <b>less</b> the effect of threat‑reducing safeguards, (2) a vulnerability <b>less</b> the effect of vulnerability‑reducing safeguards, and (3) an asset <b>less</b> the effect of asset value‑reducing safeguards". Safeguards always <i>reduce</i>, so any option with "plus" is wrong.'},"a6-3":{e:'In the risk management framework, <b>risk identification</b> = plan & organise, identify/inventory/categorise assets, classify/value/prioritise assets, identify & prioritise threats, <b>specify asset vulnerabilities</b>. <b>Risk assessment</b> = determine loss frequency, evaluate loss magnitude, calculate risk, assess risk acceptability. So "Specify Asset Vulnerabilities" is part of identification, not assessment.'},"a6-4":{e:'<b>Risk appetite</b> is "the quantity and nature of risk that organizations are willing to accept as they evaluate the trade‑offs between perfect security and unlimited accessibility". Residual risk is what remains after controls; loss frequency and magnitude are inputs to the risk calculation.'},"a6-5":{e:'Risk identification components: <b>identify, inventory & categorise assets</b>; <b>classify, value & prioritise assets</b>; identify & prioritise threats; <b>specify asset vulnerabilities</b>. "Evaluate loss magnitude" belongs to risk <i>assessment</i>.'},"a6-6":{e:'US NSI classification (EO 12958): <b>Top Secret</b> – could cause <i>exceptionally grave</i> damage; <b>Secret</b> – could cause <i>serious</i> damage; <b>Confidential</b> – could cause <i>damage</i> to national security. "Internal" is a corporate label, not an NSI level. Memory trick: grave → serious → damage.'},"a6-7":{stmt:'<table class="qtable"><thead><tr><th>Threat</th><th>Example</th></tr></thead><tbody><tr><td>1. Espionage or trespass</td><td>a. Damage to or destruction of systems or information.</td></tr><tr><td>2. Sabotage or vandalism</td><td>b. Unauthorized access and/or data collection</td></tr><tr><td>3. Information extortion</td><td>c. Illegal confiscation of equipment or information</td></tr><tr><td>4. Theft</td><td>d. Blackmail threat of information disclosure</td></tr></tbody></table>',e:"<ul><li><b>Espionage or trespass</b> → unauthorised access and/or data collection (<b>b</b>).</li><li><b>Sabotage or vandalism</b> → damage to or destruction of systems or information (<b>a</b>).</li><li><b>Information extortion</b> → blackmail threat of information disclosure (<b>d</b>), e.g. ransomware.</li><li><b>Theft</b> → illegal confiscation of equipment or information (<b>c</b>).</li></ul>Answer: <b>1 – b, 2 – a, 3 – d, 4 – c</b>."},"a6-8":{e:'Encrypting data and demanding payment for the key is <b>information extortion</b> – "threaten people and extort money or assets" (ransomware is the textbook example). The router compromise is merely how the attacker got in; the defining feature is the demand for payment.'},"a6-9":{q:"An organization's Hospital Electronic Health Record (EHR) System (Asset A) has an asset value of 50 on a scale of 0–100. Industry reports indicate a 10% probability of a cyberattack in a given year. Based on current vulnerabilities and protection mechanisms, the attack has a 50% probability of success if attempted. Information security analysts estimate that a successful attack would result in a 100% loss or compromise of the EHR system's value. The assumptions and data used in the analysis are considered 90% accurate, and the resulting risk value should be adjusted by adding the 10% uncertainty. Using the formula: Risk = (Loss Frequency × Loss Magnitude) + Uncertainty Term, what is the risk score for Asset A?",e:"Loss frequency is how often a successful attack is expected; loss magnitude is how much of the asset is lost. Multiply them for the base risk, then add the uncertainty: 10% of the base risk, because the data is only 90% accurate. Risk = <b>2.75</b>.",steps:["LF = Likelihood of attack × Probability of success = 0.10 × 0.50 = 0.05","LM = Asset value × % of asset lost = 50 × 1.00 = 50","Base risk = LF × LM = 0.05 × 50 = 2.5","Uncertainty = Base risk × (1 − accuracy) = 2.5 × 0.10 = 0.25","Risk = 2.5 + 0.25 = 2.75"]},"a6-10":{e:'<b>True.</b> "The goal of risk assessment is to assign a risk rating or score that represents the relative risk for a specific vulnerability of an information asset" – this lets managers compare and prioritise risks.'},"a7-1":{e:'Processor protection rings: <b>Ring 0 is the most privileged</b> – "when you are operating at ring 0, the hardware fully listens to you". The kernel runs at ring 0 (sometimes using ring 1); rings 1–3 are restricted, and user programs run in <b>ring 3</b>. Hackers want to reach kernel space because nothing is more privileged than the kernel.'},"a7-2":{e:'Requirements for <b>public‑key (asymmetric)</b> encryption: one algorithm with a pair of keys; sender and receiver each hold one of the matched pair; one of the two keys must be kept secret. "The sender and receiver must share the algorithm <b>and the key</b>" is a requirement of <b>symmetric (conventional)</b> encryption, so it is the false statement.'},"a7-3":{e:"A hash function maps a variable-length message to a fixed‑length digest (✓); hashes are used for intrusion and virus detection – store H(file) and compare later (✓); a hash function can build a PRF or PRNG (✓). The false one: the compression function in secure hash algorithms is either <b>specifically designed for the hash</b> or <b>based on a symmetric block cipher</b> – not public‑key or stream cipher based."},"a7-4":{e:"<b>HTTPS</b> = <b>HTTP over SSL</b> (today its successor TLS) – it secures communication between browser and web server. SSH is a remote-shell protocol; TCP/UDP are transport protocols."},"a7-5":{e:"Accountability and auditability are two of the five principles in the industry lecture (CIA + Accountability + Auditability). <b>Accountability</b> = an individual is entrusted with and answerable for equipment, keying material and information. <b>Auditability</b> = actions and events can be traced and reviewed through records and evidence. Order: Accountability, Auditability."},"a7-6":{stmt:'<table class="qtable"><thead><tr><th>Firewall type</th><th>Description</th></tr></thead><tbody><tr><td>1. Stateful Inspection Firewall</td><td>a. Examine individual data packets, making decisions to allow or block them based on predefined rules.</td></tr><tr><td>2. Packet Filters</td><td>b. Serves as the gateway from one network to another for a specific application.</td></tr><tr><td>3. Proxy Firewalls</td><td>c. Allows or blocks traffic based on state, port, and protocol.</td></tr><tr><td>4. Next Generation Firewalls</td><td>d. Combines traditional stateful firewall functions with application awareness and control, integrated intrusion prevention, advanced threat detection, and user identity awareness.</td></tr></tbody></table>',e:"<ul><li><b>Stateful inspection</b>: tracks connection <i>state</i> as well as port and protocol → <b>c</b>.</li><li><b>Packet filter</b>: looks at each packet on its own against predefined rules (stateless) → <b>a</b>.</li><li><b>Proxy (application-level) firewall</b>: acts as the gateway between networks for a specific application → <b>b</b>.</li><li><b>NGFW</b>: stateful inspection plus application awareness, IPS, threat detection and user identity → <b>d</b>.</li></ul>Answer: <b>1 – c, 2 – a, 3 – b, 4 – d</b>."},"a7-7":{e:"A <b>VPN</b> creates an encrypted tunnel and masks your IP address, turning a public Wi‑Fi connection into a private one. IPsec and SSL are protocols VPNs can use; DNS resolves names to IPs."},"a7-8":{stmt:'<table class="qtable"><thead><tr><th>Kill-chain phase</th><th>Activity</th></tr></thead><tbody><tr><td>1. Reconnaissance</td><td>a. Creating a malicious payload or malware tailored to the target.</td></tr><tr><td>2. Exploitation</td><td>b. Establishing a remote communication channel to control the compromised system.</td></tr><tr><td>3. Weaponization</td><td>c. Triggering the code to breach the system vulnerability.</td></tr><tr><td>4. Command and Control</td><td>d. Gathering target data, scanning networks, and finding weak spots.</td></tr></tbody></table>',e:"These are phases of the cyber kill chain (reconnaissance → weaponization → delivery → exploitation → installation → command & control → actions on objectives). <ul><li><b>Reconnaissance</b>: gather data, scan, find weak spots → <b>d</b>.</li><li><b>Exploitation</b>: trigger the code that breaches the vulnerability → <b>c</b>.</li><li><b>Weaponization</b>: build a payload tailored to the target → <b>a</b>.</li><li><b>Command and control</b>: remote channel to control the compromised system → <b>b</b>.</li></ul>Answer: <b>1 – d, 2 – c, 3 – a, 4 – b</b>."},"a7-9":{qfig:"ddos",e:"Several <b>compromised systems</b> (a botnet) all send traffic through the internet to one <b>target server</b>. Many sources overwhelming one victim is a <b>Distributed Denial of Service (DDoS)</b> attack, which targets <i>availability</i>. Brute force is password guessing, session hijacking takes over an existing session, and DNS spoofing redirects name resolution; none of these needs many attacking machines."},"a7-10":{e:`A <b>SIEM</b> (Security Information and Event Management) system collects logs from many sources, <b>correlates and analyses</b> them, and raises alerts ("automatically compile all the logs, do some analytics on it and tell you what is happening"). It doesn't itself encrypt traffic, filter websites or scan for vulnerabilities.`},"a8-1":{e:'That sentence is the definition of <b>risk management</b>, not risk assessment: "Risk management: the process of identifying, assessing, and reducing risks". <b>Risk assessment</b> only determines the relative risk (score) of each vulnerability. The other two statements are correct.'},"a8-2":{e:"<b>Risk appetite</b> – the quantity and nature of risk an organisation is willing to accept while balancing security against business needs like accessibility and usability. Risk capacity is the maximum risk it <i>can</i> bear; residual risk remains after controls; exposure is the potential loss."},"a8-3":{e:"<b>True.</b> This is the textbook definition of residual risk (threat, vulnerability and asset each <i>less</i> the effect of their safeguards)."},"a8-4":{e:"Rearrange ALE = SLE × ARO to get ARO = ALE ÷ SLE.",steps:["ALE = SLE × ARO  ⇒  ARO = ALE ÷ SLE","ARO = ₹12,00,000 ÷ ₹8,00,000","ARO = 1.5 (the breach is expected 1.5 times a year)"]},"a8-5":{e:"First find the Single Loss Expectancy, then annualise it.",steps:["SLE = Asset Value × Exposure Factor","SLE = ₹15,00,000 × 0.40 = ₹6,00,000","ALE = SLE × ARO","ALE = ₹6,00,000 × 2 = ₹12,00,000"]},"a8-6":{e:"Cost–benefit analysis: CBA = ALE(prior) − (ALE(post) + ACS). A positive CBA means the safeguard is worth it.",steps:["CBA = ALE(prior) − [ALE(post) + ACS]","CBA = ₹20,00,000 − (₹8,00,000 + ₹3,00,000)","CBA = ₹20,00,000 − ₹11,00,000 = ₹9,00,000 (positive ⇒ the control is justified)"]},"a8-7":{qfig:"cer-q",fig:"cer",e:"As sensitivity increases, the system gets stricter. Curve <b>1</b> falls from 100% to 0: fewer impostors get in, so it is the <b>False Acceptance Rate (FAR)</b>. Curve <b>2</b> rises from 0 to 100%: more genuine users are turned away, so it is the <b>False Rejection Rate (FRR)</b>. Point <b>3</b>, where they cross, is the <b>Crossover Error Rate (CER)</b>, where FAR = FRR. Answer: <b>1 – FAR, 2 – FRR, 3 – CER</b>. A lower CER means a more accurate device."},"a8-8":{e:"<b>Identification</b> = claiming an identity (e.g. entering a username/ID). <b>Authentication</b> = proving the claim (something you know / have / are / produce). Then come <b>authorization</b> (what you may access) and <b>accountability</b> (tracing actions) – the IAAA model."},"a8-9":{e:"<b>Non‑repudiation</b> needs a <b>digital signature</b>: the employee signs with their <b>private key</b>, and anyone can verify with the public key. Because only they hold that private key, they cannot later deny approval. Encrypting with the organisation's public key gives confidentiality, a hash alone gives integrity but not origin, and access control doesn't prove who approved."},"a8-10":{e:`A <b>Certificate Authority (CA)</b> issues and signs digital certificates binding a public key to an organisation – it is "the electronic notary public". An RA only verifies requesters on the CA's behalf; a repository just stores certificates; an IdP handles login federation.`},"a9-1":{e:"The <b>Fair Information Practice Principles</b> were first set out by the <b>US Secretary's Advisory Committee on Automated Personal Data Systems</b> in its 1973 report <i>Records, Computers and the Rights of Citizens</i> (5 principles). OECD (1980), the EU Directive (1995) and FTC principles (1998) came later and built on it."},"a9-2":{e:'<b>Samuel Warren and Louis Brandeis</b>, "The Right to Privacy", <i>Harvard Law Review</i>, <b>1890</b> – privacy as "the right to be let alone", written in reaction to an intrusive press. Westin (1967) defined privacy as control over information; Posner (1975) gave the economic view.'},"a9-3":{e:'<b>Reductionism</b> (Thomson, 1975) says privacy is derivative of other rights like property, bodily security and freedom – "there is nothing called privacy". <b>Coherentism</b> treats privacy as a distinct right of its own.'},"a9-4":{e:"The <b>controller</b> (OECD/GDPR term) determines the purposes and means of processing personal data; India's PDP/DPDP calls it the <b>Data Fiduciary</b>. Mapping: data subject ↔ data principal; controller ↔ data fiduciary; processor ↔ data processor."},"a9-5":{e:"Under India's framework the <b>Data Subject</b> is called the <b>Data Principal</b> – the individual to whom the personal data relates."},"a9-6":{e:"Smith et al. (1996) – Concern For Information Privacy (CFIP) has four dimensions: <b>collection</b>, <b>unauthorized access</b>, <b>secondary use</b> and <b>errors</b>. Encryption strength is not one of them."},"a9-7":{e:`Posner's economic view: "Privacy is not important so long as there is no economic consequence" – privacy matters <b>only insofar as it has economic consequences</b>; it could even reduce economic efficiency.`},"a9-8":{e:"Westin (2003): Privacy Baseline 1945–60; 1st Era 1961–79 (privacy becomes an explicit issue, FIPPs); 2nd Era 1980–89 (databases, European national laws); <b>3rd Era 1990–2002</b> – rise of the Internet, Web 2.0 and the <b>9/11 terrorist attack</b> changed the landscape of information exchange."},"a9-9":{e:`Westin distinguished <b>privacy</b> – control over one's exposure to others (exclusive/restricted access) – from <b>information privacy / informational self‑determination</b> – "the claim of individuals… to determine for themselves when, how and to what extent information about them is communicated to others".`},"a9-10":{e:"<b>False.</b> That describes <b>reductionism</b>. Coherentism treats privacy as a <i>distinct</i>, independent right."},"a10-1":{e:'<b>True.</b> From the "related words" slide: "Confidentiality concerns the externalization of restricted but accurate information to a specific entity." British law embraces privacy as confidentiality.'},"a10-2":{e:"Regulatory timeline: FIPPs (1973) → OECD Guidelines (1980) → <b>EU Data Protection Directive (1995) → GDPR (adopted 2016, enforceable 25 May 2018)</b>. FTC principles (1998) and APEC are separate frameworks."},"a10-3":{e:"In randomization, each provider adds random noise (stores x<sub>i</sub> + e<sub>i</sub> instead of x<sub>i</sub>). The receiver cannot recover exact values but uses a <b>distribution reconstruction algorithm</b> to estimate the original data <i>distribution</i> – enough for aggregate mining."},"a10-4":{e:"k‑anonymity (Sweeney, 2002): each combination of <b>quasi‑identifier</b> values in the released data must be indistinguishably matched to <b>at least k individuals</b>, so no record can be singled out among fewer than k people."},"a10-5":{e:'"Personal data that has been de‑identified, encrypted or pseudonymised but <b>can be used to re‑identify</b> a person <b>remains personal data</b> and falls within the scope of the GDPR." Only truly anonymous data falls outside GDPR.'},"a10-6":{e:"k‑anonymity uses <b>suppression</b> (removing values/columns entirely, e.g. name) and <b>generalization</b> (reducing granularity, e.g. age 34 → 30–39, PIN 600036 → 6000**)."},"a10-7":{answer:[0,2,3],e:"<b>Quasi‑identifiers</b> don't identify a person alone but can in combination (Sweeney showed ZIP + date of birth + gender identifies ~87% of Americans). <b>ZIP code, date of birth and gender</b> are quasi‑identifiers; a <b>passport/ID number</b> is a direct identifier."},"a10-8":{e:"The <b>privacy paradox</b> (Norberg et al., 2007) is the gap between people's stated privacy concerns/intentions and their actual disclosure behaviour."},"a10-9":{e:`<b>Anonymity</b> = ability to conceal a person's <i>identity</i>. <b>Secrecy</b> = <i>intentional concealment of information</i> ("secrecy hides far more than what is private"). <b>Transparency</b> = disclosing information about oneself.`},"a10-10":{e:"An R‑U map (Duncan et al., 2001) plots disclosure <b>R</b>isk against data <b>U</b>tility. Full anonymisation kills utility; full PII maximises risk. T
